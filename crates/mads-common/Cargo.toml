[package]
name = "mads-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "HTTP, PostgreSQL, JWT, cookies, and Passport integrations for MADS.rs"

[features]
default = ["http", "database"]
http = [
    "dep:axum",
    "dep:axum-extra",
    "dep:mads-common-macros",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_path_to_error",
    "dep:serde_urlencoded",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
]
database = [
    "dep:deadpool-diesel",
    "dep:diesel",
    "dep:diesel_migrations",
    "dep:tokio",
]
jwt = [
    "dep:base64",
    "dep:jsonwebtoken",
    "dep:serde",
    "dep:serde_json",
    "mads-common-macros?/passport",
]
cookies = ["http", "dep:cookie", "axum-extra/cookie", "mads-common-macros?/cookies"]

[dependencies]
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
deadpool-diesel = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
mads-common-macros = { path = "../mads-common-macros", version = "=0.8.0-beta.1", optional = true }
mads-core = { path = "../mads-core", version = "=0.8.0-beta.1" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_path_to_error = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
http-body.workspace = true
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
