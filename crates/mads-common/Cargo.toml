[package]
name = "mads-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "HTTP, JWT, cookies, and Passport integrations for MADS.rs"

[features]
default = ["http"]
http = [
    "dep:axum",
    "dep:axum-extra",
    "dep:mads-common-macros",
    "dep:rustix",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_path_to_error",
    "dep:serde_urlencoded",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
]
jwt = [
    "dep:base64",
    "dep:jsonwebtoken",
    "dep:serde",
    "dep:serde_json",
    "mads-common-macros?/passport",
]
cookies = ["http", "dep:cookie", "axum-extra/cookie", "mads-common-macros?/cookies"]
logger = ["dep:chrono"]

[dependencies]
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
mads-common-macros = { path = "../mads-common-macros", version = "=0.9.0", optional = true }
mads-core = { path = "../mads-core", version = "=0.9.0" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_path_to_error = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
chrono = { version = "0.4.24", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
http-body.workspace = true
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
