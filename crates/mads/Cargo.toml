[package]
name = "mads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "Modular Rust application framework with Axum and Passport integrations"

[dependencies]
mads-common = { path = "../mads-common", version = "=0.9.0", optional = true, default-features = false }
mads-core = { path = "../mads-core", version = "=0.9.0" }
mads-extra = { path = "../mads-extra", version = "=0.9.0", optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild.workspace = true

[features]
default = ["common", "runtime-tokio"]
common = ["http", "logger"]
http = ["dep:mads-common", "mads-common/http"]
jwt = ["dep:mads-common", "mads-common/jwt"]
cookies = ["http", "mads-common/cookies"]
logger = ["dep:mads-common", "mads-common/logger"]
runtime-tokio = ["mads-core/runtime-tokio"]
extra = ["dep:mads-extra"]

[lints]
workspace = true
