[package]
name = "mads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Modular Rust application framework with Axum, Diesel, and Passport integrations"

[dependencies]
mads-common = { path = "../mads-common", version = "=0.8.0", optional = true, default-features = false }
mads-core = { path = "../mads-core", version = "=0.8.0" }
mads-extra = { path = "../mads-extra", version = "=0.8.0", optional = true }

[dev-dependencies]
diesel.workspace = true
diesel_migrations.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild.workspace = true

[features]
default = ["common", "runtime-tokio"]
common = ["http", "database"]
http = ["dep:mads-common", "mads-common/http"]
database = ["dep:mads-common", "mads-common/database"]
jwt = ["dep:mads-common", "mads-common/jwt"]
cookies = ["http", "mads-common/cookies"]
runtime-tokio = ["mads-core/runtime-tokio"]
extra = ["dep:mads-extra"]

[lints]
workspace = true
