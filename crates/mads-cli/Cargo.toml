[package]
name = "mads-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "Command-line tools for MADS.rs applications"

[dependencies]
cargo_metadata.workspace = true
diesel_table_macro_syntax.workspace = true
mads = { path = "../mads", version = "=0.8.0" }
mads-common = { path = "../mads-common", version = "=0.8.0", default-features = false, features = ["http"] }
notify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
tempfile = "3"
tokio.workspace = true
rustix.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "mads"
path = "src/main.rs"
doc = false

[lints]
workspace = true
