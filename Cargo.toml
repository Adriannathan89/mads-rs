[workspace]
resolver = "3"
members = [
    "crates/mads",
    "crates/mads-core",
    "crates/mads-core-macros",
    "crates/mads-common",
    "crates/mads-common-macros",
    "crates/mads-cli",
    "crates/mads-extra",
]

[workspace.package]
version = "0.8.0-beta.1"
edition = "2024"
rust-version = "1.85"
authors = ["MADS.rs contributors"]
repository = "https://github.com/Adriannathan89/mads"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
base64 = "0.22"
cargo_metadata = "=0.19.2"
cookie = { version = "=0.18.1", default-features = false, features = ["percent-encode"] }
deadpool-diesel = { version = "=0.6.1", default-features = false, features = ["postgres", "rt_tokio_1"] }
diesel = { version = "=2.2.12", default-features = false, features = ["postgres", "32-column-tables"] }
diesel_migrations = { version = "=2.2.0", default-features = false, features = ["postgres"] }
diesel_table_macro_syntax = "=0.2.0"
dotenvy = "=0.15.7"
inventory = "0.3"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
notify = "=8.2.0"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "=1.0.28"
syn = { version = "2", features = ["full", "extra-traits"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.8.23"
toml_edit = "=0.22.27"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
trybuild = "1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
