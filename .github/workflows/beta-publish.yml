name: Publish beta

on:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: crates-io-beta-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify beta release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Require a prerelease workspace version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" != *-* ]]; then
            echo "Refusing to publish non-prerelease version: $version" >&2
            exit 1
          fi
          echo "Publishing workspace prerelease $version"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Test documentation
        run: cargo test --locked --workspace --all-features --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Verify v0.8 feature boundaries and package contents
        run: |
          cargo check -p mads-core --no-default-features
          cargo check -p mads-common --no-default-features --features http
          cargo check -p mads-common --no-default-features --features database
          cargo check -p mads-common --no-default-features --features http,database
          cargo check -p mads-common --no-default-features --features jwt
          cargo check -p mads-common --no-default-features --features cookies
          cargo check -p mads --no-default-features
          cargo check -p mads --no-default-features --features http,runtime-tokio
          cargo check -p mads --no-default-features --features http,database
          bash script/verify-package-contents.sh
      - name: Build distributable crate archives
        run: cargo package --locked --workspace --no-verify

  cli-platform:
    name: Verify CLI platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libpq (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Install libpq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "LIBRARY_PATH=$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Configure preinstalled libpq (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pg = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $pg) {
            throw 'The Windows runner does not provide a PostgreSQL client library.'
          }
          "PQ_LIB_DIR=$($pg.FullName)\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($pg.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test CLI parser, JSON, paths, scaffold, and processes
        run: |
          cargo test -p mads-cli --lib command::tests -- --test-threads=1
          cargo test -p mads-cli --test json_cli -- --test-threads=1
          cargo test -p mads-cli --test json_cli model_serializes_nullable_diagnostics_and_normalized_locations -- --test-threads=1
          cargo test -p mads-cli --test scaffold_cli -- --test-threads=1
          cargo test -p mads-cli --lib scaffold::publish::tests::destination_race_preserves_the_competing_directory_and_cleans_staging -- --test-threads=1
          cargo test -p mads-cli --test inspection_cli a_binary_without_standard_run_is_killed_and_diagnosed -- --test-threads=1
          cargo test -p mads-cli --test dev_cli real_dev_loop -- --test-threads=1

  msrv:
    name: Verify Rust 1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Test minimum supported Rust version
        run: cargo test --locked --workspace --all-features

  postgres:
    name: Verify PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - run: cargo test --locked -p mads-common --all-features --test database_postgres -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-common --all-features --test database_http_postgres -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-common --all-features server::tests::database_migration_failure_prevents_listener_binding -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-cli --test database_cli -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-cli --test database_generate_postgres -- --ignored --test-threads=1
      - run: cargo test --locked -p mads --test postgres_crud -- --ignored --test-threads=1

  coverage:
    name: Verify coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce line coverage
        run: cargo llvm-cov --workspace --all-features --ignore-filename-regex '(^|/)tests/ui/' --fail-under-lines 85

  publish:
    name: Publish crates to crates.io
    needs:
      - verify
      - cli-platform
      - msrv
      - postgres
      - coverage
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Repository or beta environment secret CRATES_IO_TOKEN is not configured." >&2
            exit 1
          fi

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          packages=(
            mads-core-macros
            mads-common-macros
            mads-core
            mads-extra
            mads-common
            mads
            mads-cli
          )

          publication_status() {
            local package="$1"
            local endpoint="https://crates.io/api/v1/crates/${package}/${version}"
            local status

            if ! status="$(
              curl --silent --show-error --location \
                --retry 3 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                --output /dev/null --write-out '%{http_code}' \
                --user-agent "mads-beta-publish/${version} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
                "$endpoint"
            )"; then
              echo "Failed to check ${package} ${version} on crates.io." >&2
              return 2
            fi

            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "Unexpected crates.io status ${status} while checking ${package} ${version}." >&2
                return 2
                ;;
            esac
          }

          for package in "${packages[@]}"; do
            echo "Checking ${package} ${version} on crates.io."
            if publication_status "$package"; then
              echo "Skipping ${package} ${version}: already published."
              continue
            else
              status=$?
            fi

            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi

            echo "Publishing ${package} ${version}"
            cargo publish --locked --package "$package"
          done
      - name: Create GitHub prerelease and tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Skipping ${tag}: GitHub release already exists."
            exit 0
          fi

          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "MADS.rs ${version}" \
            --prerelease \
            --latest=false \
            --notes-file -
