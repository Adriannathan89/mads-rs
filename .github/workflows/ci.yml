name: CI

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main
      - beta
      - develop

permissions:
  contents: read

jobs:
  stable:
    name: Stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Test documentation
        run: cargo test --workspace --all-features --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: Rust 1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - name: Test minimum supported Rust version
        run: cargo test --locked --workspace --all-features

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - run: cargo test -p mads-common --test database_postgres -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-common --all-features --test database_http_postgres -- --ignored --test-threads=1
      - run: cargo test -p mads-common server::tests::database_migration_failure_prevents_listener_binding -- --ignored --test-threads=1
      - run: cargo test -p mads-cli --test database_cli -- --ignored --test-threads=1
      - run: cargo test --locked -p mads-cli --test database_generate_postgres -- --ignored --test-threads=1
      - run: cargo test -p mads --test postgres_crud -- --ignored --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL client headers
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce line coverage
        run: cargo llvm-cov --workspace --all-features --ignore-filename-regex '(^|/)tests/ui/' --fail-under-lines 85 -- --include-ignored --test-threads=1
