name: CI

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
      - beta
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: Linux verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check persistence feature boundaries
        run: |
          cargo check -p mads-persistence --no-default-features
          cargo check -p mads-persistence --no-default-features --features sea-orm-postgres
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Test documentation
        run: cargo test --locked --workspace --all-features --doc
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Build distributable crate archives
        run: cargo package --locked --workspace --no-verify

  cli-platform:
    name: CLI platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test CLI parser, JSON, paths, scaffold, and processes
        run: |
          cargo test -p mads-cli --lib command::tests -- --test-threads=1
          cargo test -p mads-cli --test json_cli -- --test-threads=1
          cargo test -p mads-cli --test json_cli model_serializes_nullable_diagnostics_and_normalized_locations -- --test-threads=1
          cargo test -p mads-cli --test scaffold_cli -- --test-threads=1
          cargo test -p mads-cli --lib scaffold::publish::tests::destination_race_preserves_the_competing_directory_and_cleans_staging -- --test-threads=1
          cargo test -p mads-cli --test inspection_cli a_binary_without_standard_run_is_killed_and_diagnosed -- --test-threads=1
          cargo test -p mads-cli --test dev_cli real_dev_loop -- --test-threads=1

  msrv:
    name: Rust 1.94.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Test minimum supported Rust version
        run: cargo test --locked --workspace --all-features

  seaorm-minimum:
    name: SeaORM 2.0.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve and test minimum SeaORM version
        run: |
          cargo update -p sea-orm --precise 2.0.0
          cargo test -p mads-persistence --features sea-orm-postgres

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p mads-persistence --features sea-orm-postgres --test postgres -- --ignored --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mads_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce line coverage
        run: cargo llvm-cov --workspace --all-features --ignore-filename-regex '(^|/)tests/ui/' --fail-under-lines 85
