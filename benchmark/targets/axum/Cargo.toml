[package]
name = "mads-bench-axum"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
